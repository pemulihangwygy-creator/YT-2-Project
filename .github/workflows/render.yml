name: Render video

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m src.render --output output/torque-converter-2d-1080p90.mp4
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: torque-converter-2d-1080p90
          path: output/torque-converter-2d-1080p90.mp4
          if-no-files-found: error
          retention-days: 90
